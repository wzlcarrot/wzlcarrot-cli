name: Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install build deps
        run: uv sync --extra binary
      - name: Build single-file binary
        run: uv run pyinstaller --clean --noconfirm packaging/pyinstaller/wzlcarrot.spec
      - name: Smoke test binary
        shell: bash
        run: |
          if [ -f dist/wzlcarrot.exe ]; then ./dist/wzlcarrot.exe version; else ./dist/wzlcarrot version; fi
      - uses: actions/upload-artifact@v4
        with:
          name: wzlcarrot-${{ matrix.os }}
          path: |
            dist/wzlcarrot
            dist/wzlcarrot.exe
          if-no-files-found: ignore
